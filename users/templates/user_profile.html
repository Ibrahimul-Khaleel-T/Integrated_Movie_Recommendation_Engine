<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SceneIt</title>
    <link rel="icon" href="{% static 'images/SceneIt_logo3.png' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<style>
  body{
    background-color: rgba(162, 149, 149, 0.9);
    z-index: 0;
  }
  .nav-link.active {
    background-color: black;
    color: white;
    border-radius: 5px;
    z-index: 0;
  }
  .title {
    color: rgb(190, 39, 39);
    font-size: 30px;
    font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
    margin-top: -2px; 
  }
  .nav-link1{
    color: rgb(232, 4, 4);
    text-decoration: none;
  }
  .nav-link1:hover{
    color: rgb(255, 45, 45);
  }
  .info{
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }
</style>
</head>
<body>
 <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
  <div class="container-fluid">
        <span class="title me-4"><strong>SceneIt</strong></span>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item me-2">
            <a class="nav-link" href="{% url 'user_home_page' %}">Home</a>
        </li>
        <li class="nav-item me-2">
          <a class="nav-link" href="">My ratings</a>
        </li>       
        <li class="nav-item me-2">
          <a class="nav-link" href="">Edit profile</a>
        </li>       
      </ul>
      <a class="nav-link1" href="{% url 'signout' %}" role="button" aria-expanded="false">Signout</a>
    </div>
  </div>
</nav>

  <div class="info">
    <div class="info1">
      <img src="{{request.user.dp.url}}" alt="dp" width="100px" height="100px" class="rounded-circle border-light shadow-sm">
    </div>
    <div class="info2">
      <div class="logo1"></div>
      <div>
        <p><strong>Username</strong></p>
        <p>{{request.user.username}}</p>
      </div>
    </div>
    <div class="info3">
      <div class="logo2"></div>
      <div>
        <p><strong>Full Name</strong></p>
        <p>{{request.user.fullname}}</p>
      </div>
    </div>
    <div class="info4">
      <div class="logo3"></div>
      <div>
        <p><strong>Email ID</strong></p>
        <p>{{request.user.email}}</p>
      </div>
    </div>
    <div class="info5">
      <div class="logo4"></div>
      <div>
        <p><strong>Mobile Number</strong></p>
        <p>{{request.user.mobile_number}}</p>
      </div>
    </div>
  </div>



<script>
  // Wait for the page to load
  document.addEventListener("DOMContentLoaded", function () {
    // Get current path
    const currentPath = window.location.pathname;

    // Loop through each nav-link
    document.querySelectorAll(".nav-link").forEach(function (link) {
      // Check if href matches current path
      if (link.getAttribute("href") === currentPath) {
        link.classList.add("active");
      }
    });
  });
</script>
</body>
</html>
