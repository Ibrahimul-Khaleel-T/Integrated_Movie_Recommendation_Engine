<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SceneIt</title>
  <link rel="icon" href="{% static 'images/SceneIt_logo3.png' %}">
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      background-color: black;
    }
    .container {
      display: flex;
      justify-content: space-between;
      padding: 20px 100px;
      position: relative;
      z-index: 2;
    }
    .title {
      color: rgb(190, 39, 39);
      font-size: 30px;
      font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
      margin-top: -27px;
    }
    .btns {
      display: flex;
      gap: 9px;
    }
    .sign_in button,
    .sign_up button {
      width: 90px;
      padding: 7px;
      border-radius: 3px;
      background-color: rgb(190, 39, 39);
      border: none;
      color: white;
      cursor: pointer;
      font-size: 14px;
      margin-top: 18px;
      overflow: hidden;
    }
    .sign_in button:hover,
    .sign_up button:hover {
      background-color: rgb(165, 22, 22);
    }

    
    .poster-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(10vw, 1fr));
      flex-wrap: wrap;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      z-index: 0;
      overflow: hidden;
    }
    .poster-grid img {
      width: 100%;
      height: 100%;
      object-fit: fill;
      opacity: 0.90;
    }
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.8);
      z-index: 1;
    }
    .label{
      position: relative;
      z-index: 2;
      color: white;
      font-size: 25px;
      font-family:'Bebas Neue', sans-serif;
      text-align: center;
      margin-top: 130px;
      overflow: hidden;
    }
    .start button{
      width: 170px;
      padding: 10px;
      border-radius: 4px;
      background-color: rgb(190, 39, 39);
      border: none;
      color: white;
      cursor: pointer;
      font-size: 25px;
      margin-top: -40px;
      overflow: hidden;
    }
    .start button:hover{
      background-color: rgb(165, 22, 22);
    }
    .section_b h1{
      z-index: 2;
      color: white;
      background-color: black;
      margin-top: 370px;
    }
  </style>
</head>
<body>

  
  <div class="container">
    <div class="title">
      <h2><strong>SceneIt</strong></h2>
    </div>
    <div class="btns">
      <div class="sign_in">
        <a href="{% url 'signin' %}"><button type="submit"><strong>Sign in</strong></button></a>
      </div>
      <div class="sign_up">
        <a href="{% url 'signup' %}"><button type="submit"><strong>Sign up</strong></button></a>
      </div>
    </div>
  </div>
  <div class="label">
    <h1><strong>Stuck on what to watch?<br>We’ve got you.</strong></h1>
    <div class="start">
      <a href="{% url 'signup' %}"><button type="submit"><strong>Let's Start</strong></button></a>
    </div>
  </div>

 

  <div class="poster-grid" id="poster-grid"></div>
  <div class="overlay"></div>

    <h1>heloo</h1>

  <div id="poster-grid"></div>

<script>
  const API_KEY = '830596140937bda925ac2c89f6deb604';  
  const Lang = ['en', 'ml', 'ta','hi'];

  const container = document.getElementById('poster-grid');

  Lang.forEach(language => {
    const API_URL = `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_original_language=${language}&sort_by=popularity.desc&page=1`;

    fetch(API_URL)
      .then(response => response.json())
      .then(data => {
        const movies = data.results;

        movies.forEach(movie => {
          if (movie.poster_path) {
            const posterPath = `https://image.tmdb.org/t/p/w500${movie.poster_path}`;
            const img = document.createElement('img');
            img.src = posterPath;
            img.style.margin = '8px'; // optional spacing
            container.appendChild(img);
          }
        });
      })
      .catch(error => console.error(`Error fetching for ${language}:`, error));
  });
</script>

</body>
