<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SceneIt</title>
    <link rel="icon" href="{% static 'images/SceneIt_logo3.png' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<style>
  .nav-link.active {
    background-color: black; /* Bootstrap primary color */
    color: white;
    border-radius: 5px;
  }
  .title {
    color: rgb(190, 39, 39);
    font-size: 30px;
    font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
    margin-top: -2px; 
  }
</style>

</head>
<body>
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
  <div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center" href="#">
        <span class="title"><strong>SceneIt</strong></span>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item me-2">
            <a class="nav-link" href="{% url 'user_home_page' %}">Home</a>
        </li>
        <li class="nav-item me-2">
            <a class="nav-link" href="{% url 'user_profile' %}">Profile</a>
        </li>
        <li class="nav-item me-2">
          <a class="nav-link" href="">Recommended movies</a>
        </li>
        <li class="nav-item dropdown me-2">
          <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
            Dropdown
          </a>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="#">Action</a></li>
            <li><a class="dropdown-item" href="#">Another action</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item" href="#">Something else here</a></li>
          </ul>
        </li>
        <li class="nav-item me-2">
          <form class="d-flex" role="search">
            <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search"/>
            <button class="btn btn-outline-success" type="submit">Search</button>
        </form>
        </li>
      </ul>
      <a class="navbar-brand" href="#">
        <img src= alt="dp" width="40px" height="40px">
    </a>
    </div>
  </div>
</nav>


<script>
  // Wait for the page to load
  document.addEventListener("DOMContentLoaded", function () {
    // Get current path
    const currentPath = window.location.pathname;

    // Loop through each nav-link
    document.querySelectorAll(".nav-link").forEach(function (link) {
      // Check if href matches current path
      if (link.getAttribute("href") === currentPath) {
        link.classList.add("active");
      }
    });
  });
</script>

{% block content %}

{% endblock %}
</body>
</html>
